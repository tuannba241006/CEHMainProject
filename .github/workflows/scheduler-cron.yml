name: Laravel Scheduler Cron (Botkeep)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: botkeep-laravel-scheduler
  cancel-in-progress: false

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Laravel schedule:run on Botkeep API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub repository secrets yet. Skipping."
            exit 0
          fi

          TARGET_URL="${SCHEDULER_URL:-https://api-ceh-das.bot-keep.xyz/api/internal/scheduler/run}"
          echo "Calling $TARGET_URL"

          HTTP_CODE=$(curl -sS -o /tmp/scheduler_response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --max-time 45 \
            "$TARGET_URL")

          cat /tmp/scheduler_response.json
          echo ""
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Scheduler trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
