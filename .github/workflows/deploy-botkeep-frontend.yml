name: Build frontend for Botkeep

on:
  workflow_run:
    workflows: ["CEH Main Project CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: botkeep-frontend-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    name: Build and publish static files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_APP_MODE: api
          VITE_API_URL: https://api-ceh-das.bot-keep.xyz
        run: npm run build


      - name: Publish dist to botkeep-static branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_dir="$(mktemp -d)"
          cp -a frontend/dist/. "$deploy_dir/"
          cd "$deploy_dir"

          git init --quiet
          git checkout --orphan botkeep-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy frontend from ${GITHUB_SHA}"

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/botkeep-static
