                - success
                - data
                - server_time
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: Đã điều chỉnh trạng thái điểm danh thủ công
                  server_time:
                    type: string
                    format: date-time
                    example: '2026-10-25T08:30:00+07:00'
                    description: Thời gian chuẩn của máy chủ (NTP)
                  data:
                    $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Danh sách ĐRL của sự kiện đã bị khóa chốt hoặc trạng thái/tỷ lệ không thay đổi (`DRL_LOCKED`, `INVALID_STATE_TRANSITION`)
          headers:
