  /attendance/staff-scan:
    post:
      tags:
      - Attendance & Anti-Fraud
      summary: Nhân viên soát vé (Staff) quét mã QR HMAC tại bàn đón tiếp (< 2.0s - Hỗ trợ Check-in & Check-out dự phòng -
        UC-OPS-02)
      description: '**Quyền:** `SinhVien` (Event Staff trong ngày hiệu lực), `ToChuc` (Host A), `Admin`.


        - **Quy tắc hiệu lực quyền Staff (`UC-OPS-05` & `UC-OPS-02`):** Quyền soát vé của sinh viên chỉ có hiệu lực khi tài
        khoản có bản ghi trong `nhan_vien_check_in` của sự kiện đó, sự kiện đang ở trạng thái `PUBLISHED` hoặc `HAPPENING`,
        và thời điểm hiện tại nằm trong ngày diễn ra sự kiện (`DATE(NOW()) BETWEEN DATE(thoi_gian_bat_dau) AND DATE(thoi_gian_ket_thuc)`).
        Nếu sinh viên không được phân công hoặc quét ngoài khung ngày hiệu lực, BE trả về `403 STAFF_NOT_ASSIGNED`.

        - Giải mã chuỗi `CEH1.{ma_ve_uuid}.{ma_tai_khoan}.{ma_su_kien}.{chu_ky_hmac}`, tính lại chữ ký HMAC-SHA256 trên chuỗi
        `"{ma_ve_uuid}|{ma_tai_khoan}|{ma_su_kien}"` bằng `hash_equals()`, đồng thời truy vấn bản ghi `dang_ky` theo `ma_ve_uuid`
        để đối chiếu `dang_ky.ma_tai_khoan` và `dang_ky.ma_su_kien` khớp tuyệt đối.

        - Trả về Họ tên, MSSV, **Khoa** và Lớp sinh hoạt của sinh viên để Staff đối chiếu thẻ sinh viên vật lý tại bàn đón
        tiếp.'
      operationId: staffScanTicketQr
      security:
      - SanctumSession: []
      x-roles:
      - SinhVien
      - ToChuc
      - Admin
      x-scope: EventStaffOrHostOrAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ma_su_kien
              - che_do_quet
              - chuoi_qr_ve
              properties:
                ma_su_kien:
                  type: integer
                  minimum: 1
                  example: 101
                che_do_quet:
                  type: string
                  enum:
                  - CHECK_IN
                  - CHECK_OUT
                  default: CHECK_IN
                chuoi_qr_ve:
                  type: string
                  minLength: 80
                  maxLength: 255
                  example: CEH1.9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d.1.101.a8f5f167f44f4964e6c998dee827110c849f8a12c3e4b5a6c7d8e9f012345678
                  pattern: ^CEH1\.[0-9a-fA-F-]{36}\.[0-9]+\.[0-9]+\.[0-9a-f]{64}$
      responses:
        '200':
          description: HỢP LỆ — Điểm danh thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - server_time
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: HỢP LỆ — Điểm danh thành công
                  server_time:
                    type: string
                    format: date-time
                    example: '2026-10-25T08:30:00+07:00'
                    description: Thời gian chuẩn của máy chủ (NTP)
                  data:
                    type: object
                    required:
                    - ma_dang_ky
                    - sinh_vien
                    - canh_bao_doi_soat_the_sv
                    - trang_thai_ve
                    - thoi_gian_quet
                    properties:
                      ma_dang_ky:
                        type: integer
                        example: 501
                      sinh_vien:
                        type: object
                        required:
                        - ho_ten
                        - mssv
                        - khoa
                        properties:
                          ho_ten:
                            type: string
                            example: Nguyễn Văn An
                          mssv:
                            type: string
                            example: '22520001'
                          khoa:
                            type: string
                            example: Khoa Hệ thống Thông tin
                          lop_sinh_hoat:
                            type: string
                            nullable: true
                            example: HTTT2022
                      canh_bao_doi_soat_the_sv:
                        type: boolean
                        example: false
                      trang_thai_ve:
                        type: string
                        enum:
                        - DaCheckIn
                        - DaCheckOut
                        example: DaCheckIn
                      thoi_gian_quet:
                        type: string
                        format: date-time
                      thoi_luong_tham_du_phut:
                        type: integer
                        nullable: true
                        example: 105
                      ti_le_drl:
                        type: number
                        format: float
                        enum:
                        - 0.0
                        - 0.5
                        - 1.0
                        nullable: true
                        example: 1.0
        '400':
          description: Chuỗi QR sai chữ ký hoặc thuộc sự kiện khác (HTTP 400)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidSignature:
                  summary: HMAC không khớp (`hash_equals` thất bại)
                  value:
                    success: false
                    error: TICKET_INVALID_SIGNATURE
                    message: Mã vé không hợp lệ hoặc đã bị chỉnh sửa.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                wrongEvent:
