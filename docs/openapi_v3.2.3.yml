  /attendance/manual-override:
    post:
      tags:
      - Attendance & Anti-Fraud
      summary: Điều chỉnh điểm danh thủ công, xóa cờ No-show/Gian lận & Lưu vết `nhat_ky_diem_danh` (UC-OPS-04)
      description: "**Quyền:** `ToChuc` (Host A), `Admin`.\n\n- Chặn với mã lỗi `409 DRL_LOCKED` nếu sự kiện đã khóa chốt\
        \ ĐRL (`da_chot_drl = 1`).\n- **Cấm override vé đã hủy (`DaHuy`):** Nếu vé đang ở trạng thái `DaHuy`, BE chặn cứng\
        \ với `409 INVALID_STATE_TRANSITION` để bảo toàn phương trình cân bằng quỹ vé và tránh xung đột `uq_dangky_ve_hieu_luc`.\n\
        - **Quy tắc gán mốc thời gian điểm danh (`chk_dangky_diemdanh` & `v_danh_sach_drl`):**\n  - Khi chuyển sang `DaCheckIn`:\
        \ đặt `ti_le_drl_moi = 0.0`; nếu `thoi_gian_check_in` đang `NULL`, gán `thoi_gian_check_in = LEAST(NOW(), su_kien.thoi_gian_bat_dau)`.\n\
        \  - Khi chuyển sang `DaCheckOut`: chọn `ti_le_drl_moi` là `1.0` (100%) hoặc `0.5` (50%); nếu `thoi_gian_check_in`\
        \ đang `NULL`, gán `thoi_gian_check_in = su_kien.thoi_gian_bat_dau`; nếu `thoi_gian_check_out` đang `NULL`, gán `thoi_gian_check_out\
        \ = COALESCE(su_kien.thoi_gian_ket_thuc_thuc_te, su_kien.thoi_gian_ket_thuc)` để bảo đảm `thoi_gian_check_out >= thoi_gian_check_in`\
        \ và hiển thị đúng thời lượng trong View `v_danh_sach_drl`.\n- Tự động đặt lại `vi_pham_no_show = 0`, `nghi_van_gian_lan\
        \ = 0`, `ma_thiet_bi_nghi_van = NULL`."
      operationId: manualOverrideAttendance
      security:
      - SanctumSession: []
      x-roles:
      - ToChuc
      - Admin
      x-scope: EventHostOrAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: ManualCheckInOverride
                required:
                - ma_dang_ky
                - trang_thai_moi
                - ti_le_drl_moi
                - ly_do
                properties:
                  ma_dang_ky:
                    type: integer
                    minimum: 1
                    example: 501
                  trang_thai_moi:
                    type: string
                    enum:
                    - DaCheckIn
                  ti_le_drl_moi:
                    type: number
                    format: float
                    enum:
                    - 0.0
                    example: 0.0
                  ly_do:
                    type: string
                    minLength: 10
                    maxLength: 1000
                    example: Đã kiểm tra thẻ sinh viên tại bàn đón tiếp do hỏng camera
              - type: object
                title: ManualCheckOutOverride
                required:
                - ma_dang_ky
                - trang_thai_moi
                - ti_le_drl_moi
                - ly_do
                properties:
                  ma_dang_ky:
                    type: integer
                    minimum: 1
                    example: 501
                  trang_thai_moi:
                    type: string
                    enum:
                    - DaCheckOut
                  ti_le_drl_moi:
                    type: number
                    format: float
                    enum:
                    - 0.5
                    - 1.0
                    example: 1.0
                  ly_do:
                    type: string
                    minLength: 10
                    maxLength: 1000
                    example: Đã đối soát thẻ sinh viên cuối giờ do điện thoại sinh viên sập nguồn
      responses:
        '200':
          description: Đã điều chỉnh trạng thái điểm danh thủ công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
