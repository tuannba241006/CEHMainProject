openapi: 3.0.3
info:
  title: Campus Event Hub API Contract
  version: 3.2.3
  description: "# Campus Event Hub — Enterprise API Contract (Contract v3.2.3 | SRS & DB Baseline v3.1.2)\nĐồ án Môn học:\
    \ Phát triển Ứng dụng Web (IS207.R11) – Khoa Hệ thống Thông tin, Trường ĐH Công nghệ Thông tin (UIT).\n\n### Chuẩn mực\
    \ Thiết kế Hợp đồng (API Contract Forge Baseline — Pre-Freeze)\n- **Tài liệu gốc đối chiếu:** SRS v3.1.2 (32 Use Cases\
    \ / 11 Phân hệ) & Database v3.1.2 (MySQL 8.0+ / 24 Bảng 3NF / 3 Views).\n- **Xác thực & Phiên (`NFR-SEC-01`):** Laravel\
    \ Sanctum SPA (`SanctumSession` qua HTTP-Only Cookie `laravel_session` + `X-XSRF-TOKEN`) và `KioskTokenAuth` (`X-Kiosk-Token`)\
    \ độc lập cho màn chiếu hội trường.\n- **Miễn trừ cờ `buoc_doi_mat_khau = true`:** Khi tài khoản nội bộ mới cấp phát có\
    \ `buoc_doi_mat_khau = true`, 3 endpoint `/auth/me`, `/auth/change-password` và `/auth/logout` được phép gọi bình thường;\
    \ toàn bộ các endpoint bảo vệ khác chặn cứng với `403 PASSWORD_CHANGE_REQUIRED`.\n- **Chuẩn thời gian:** Toàn bộ trường\
    \ `date-time` sử dụng chuẩn ISO 8601 kèm múi giờ Việt Nam (`+07:00`, ví dụ `2026-10-25T08:30:00+07:00`). Các API có đếm\
    \ ngược trả kèm `server_time`.\n- **Chuỗi QR chuẩn hóa & Quy tắc ký HMAC-SHA256:**\n  - **Dữ liệu gốc để ký HMAC vé (`PayloadToSign`):**\
    \ Ghép bằng dấu phân cách `|` `\"{ma_ve_uuid}|{ma_tai_khoan}|{ma_su_kien}\"` để triệt tiêu hoàn toàn nguy cơ trùng chuỗi\
    \ giữa hai số nguyên `ma_tai_khoan` và `ma_su_kien`; chữ ký `chu_ky_hmac = HMAC_SHA256(PayloadToSign, APP_SECRET_KEY)`.\n\
    \  - **QR Vé cá nhân (`payload_qr`):** `CEH1.{ma_ve_uuid}.{ma_tai_khoan}.{ma_su_kien}.{chu_ky_hmac}` (Regex: `^CEH1\\\
    .[0-9a-fA-F-]{36}\\.[0-9]+\\.[0-9]+\\.[0-9a-f]{64}$`). Khi đối soát tại `UC-OPS-02`, BE vừa kiểm tra `hash_equals()` vừa\
    \ đối chiếu khớp với dòng bản ghi `dang_ky` trong CSDL.\n  - **QR Kiosk hội trường (`qr_payload`):** `CEH1K.{ma_su_kien}.{totp_code}`\
    \ (Regex: `^CEH1K\\.[0-9]+\\.[0-9]{6}$`).\n  - **Chữ ký Giấy chứng nhận (`chung_nhan.ma_hash`):** `ma_hash = HMAC_SHA256(\"\
    {ma_dang_ky}|{ma_tai_khoan}|{ma_su_kien}\", APP_SECRET_KEY)`.\n- **Thứ tự Khóa Dòng Toàn cục:** `tai_khoan -> phong_hoi_truong\
    \ -> dat_phong -> su_kien -> dang_ky -> hang_doi_waitlist`.\n\n### Bảng Định nghĩa Phạm vi Quyền theo Tài nguyên (`x-scope`\
    \ & Chính sách 403/404)\n- **Chính sách 404 vs 403:** Nếu bản ghi `{id}` không tồn tại trong CSDL (hoặc sự kiện ở trạng\
    \ thái nội bộ khi gọi từ `GET /events/{id}` công khai) $\\rightarrow$ trả `404 NOT_FOUND`. Nếu bản ghi tồn tại nhưng người\
    \ gọi không thỏa mãn `x-scope` dưới đây $\\rightarrow$ trả `403 FORBIDDEN` (riêng `/attendance/staff-scan` trả `403 STAFF_NOT_ASSIGNED`).\n\
    - **`EventHostOrAdmin`:** `user.loai_tai_khoan == 'Admin'` HOẶC (`user.loai_tai_khoan == 'ToChuc'` VÀ `user.ma_don_vi_to_chuc\
    \ == su_kien.ma_don_vi_to_chuc`).\n- **`EventCohostOrAdmin`:** `user.loai_tai_khoan == 'Admin'` HOẶC tồn tại bản ghi trong\
    \ `su_kien_dong_to_chuc` của sự kiện có `ma_don_vi_to_chuc == user.ma_don_vi_to_chuc`.\n- **`EventHostOrConfirmedCohostOrAdmin`:**\
    \ Thỏa `EventHostOrAdmin` HOẶC là đơn vị đồng tổ chức đã xác nhận `trang_thai_xac_nhan == 'DONG_Y'`.\n- **`FacultyReviewerOrAdmin`:**\
    \ `user.loai_tai_khoan == 'Admin'` HOẶC (`user.loai_tai_khoan == 'ToChuc'` thuộc đơn vị có `loai_don_vi == 'Khoa'` & `ma_don_vi_cha\
    \ IS NULL` quản lý trực tiếp CLB chủ trì sự kiện `su_kien.don_vi_host.ma_don_vi_cha == user.ma_don_vi_to_chuc`).\n- **`EventHostOrCohostOrFacultyOrAdmin`:**\
    \ Thỏa một trong 3 phạm vi `EventHostOrAdmin`, `EventCohostOrAdmin` hoặc `FacultyReviewerOrAdmin`.\n- **`EventStaffOrHostOrAdmin`:**\
    \ Thỏa `EventHostOrAdmin` HOẶC (`user.loai_tai_khoan == 'SinhVien'` có trong `nhan_vien_check_in` của sự kiện VÀ sự kiện\
    \ ở `PUBLISHED`/`HAPPENING` VÀ `DATE(NOW())` nằm trong ngày diễn ra sự kiện).\n- **`TicketOwner` / `TicketOwnerOrAdmin`:**\
    \ `dang_ky.ma_tai_khoan == user.ma_tai_khoan` (hoặc `user.loai_tai_khoan == 'Admin'`).\n- **`WaitlistOwner`:** `hang_doi_waitlist.ma_tai_khoan\
    \ == user.ma_tai_khoan`.\n- **`CertificateOwnerOrAdmin`:** Chứng nhận thuộc vé có `dang_ky.ma_tai_khoan == user.ma_tai_khoan`\
    \ (hoặc `user.loai_tai_khoan == 'Admin'`).\n- **`NotificationOwner`:** `thong_bao.ma_tai_khoan == user.ma_tai_khoan`.\n"
servers:
- url: http://localhost:8000/api/v1
  description: Local Development Server (Laravel 11 API v1)
- url: https://campuseventhub.uit.edu.vn/api/v1
  description: Production Environment (API v1)
tags:
- name: Auth & Account
  description: Xác thực Sanctum SPA Cookie, Đăng ký OTP, Single Active Session, Hồ sơ (UC-AUTH-01 -> 05)
- name: Admin & Organizations
  description: Quản trị Cây Đơn vị Tổ chức, Chuyên đề, Upload & Cấp phát User Nội bộ (UC-ADM-01)
- name: Venues & Room Schedules
  description: Quản lý Phòng ốc, Lịch Timeline & Kiểm tra Xung đột Lịch đệm 15p (UC-ROOM-01, UC-ROOM-02)
- name: Event Lifecycle & Approvals
  description: Soạn thảo, Soft Hold 48h Co-host, Duyệt Đa cấp Host-driven, Mở lại & Hủy khẩn cấp (UC-EVT-01 -> 03)
- name: Event Discovery
  description: Khám phá, Tìm kiếm Full-Text & Thẻ OpenGraph SSR (UC-DISC-01, UC-DISC-02)
- name: Booking & Waitlist
  description: Kiểm tra Trùng lịch trước đặt vé, Đặt vé Tương tranh, Waitlist FIFO & Claim Window (UC-BOOK-01 -> 03)
- name: My Tickets & Cancellation
  description: Ví Vé Cá nhân 3 Tab, Screen Wake Lock & Khóa Hủy vé T-4h (UC-TCK-01, UC-TCK-02)
- name: Attendance & Anti-Fraud
  description: Kiosk Dynamic TOTP 30s, Soát vé HMAC Staff (Check-in/Check-out dự phòng), Device Binding (UC-OPS-01 -> 05)
- name: Feedback, Certificate & DRL
  description: Khảo sát 48h, Ân hạn Admin, e-Certificate SHA-256 Che PII, Khóa chốt Bảng ĐRL CTSV (UC-FEED-01, UC-CERT-01,
    UC-DRL-01)
- name: Reports & Notifications
  description: Dashboard BTC, BI Vĩ mô Toàn trường, Vi phạm No-show & Thông báo In-app (UC-REP-01, UC-REP-02, UC-NOTIF-01)
- name: AI Assistant
  description: Organizer Content & Analytics Copilot, Admin BI Text-to-Insight Read-Only (UC-AI-01, UC-AI-02)
paths:
  /sanctum/csrf-cookie:
    get:
      tags:
      - Auth & Account
      summary: Khởi tạo CSRF Cookie (`XSRF-TOKEN`) cho ứng dụng React SPA (UC-AUTH-02)
      description: '**Quyền:** `Public`.


        Endpoint của Laravel Sanctum giúp trình duyệt nhận cookie `XSRF-TOKEN` trước khi gọi `/auth/login`. Lưu ý: trên môi
        trường Laravel chuẩn, route này có thể được mount ở cả `/sanctum/csrf-cookie` và `/api/v1/sanctum/csrf-cookie`.'
      operationId: getCsrfCookie
      x-roles:
      - Public
      responses:
        '204':
          description: Đã thiết lập cookie `XSRF-TOKEN` thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCsrfCookie'
      security: []
    servers:
    - url: http://localhost:8000
      description: Local Root Server (Sanctum Web Route)
    - url: https://campuseventhub.uit.edu.vn
      description: Production Root Server (Sanctum Web Route)
  /auth/register:
    post:
      tags:
      - Auth & Account
      summary: Đăng ký tài khoản Sinh viên qua Email OTP & Đối chiếu MSSV (UC-AUTH-01)
      description: '**Quyền:** `Public`.


        - Email bắt buộc có đuôi `@gm.uit.edu.vn` và tiền tố trước `@` khớp tuyệt đối với `mssv`.

        - Bắt buộc `dong_y_nghi_dinh_13 = true`.

        - Rate limit: tối đa 3 lần gửi OTP trong 10 phút.'
      operationId: registerStudent
      x-roles:
      - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ho_ten
              - mssv
              - email
              - lop_sinh_hoat
              - ma_khoa
              - mat_khau
              - xac_nhan_mat_khau
              - dong_y_nghi_dinh_13
              properties:
                ho_ten:
                  type: string
                  minLength: 2
                  maxLength: 150
                  example: Nguyễn Văn An
                mssv:
                  type: string
                  pattern: ^[0-9]{8}$
                  example: '22520001'
                email:
                  type: string
                  format: email
                  maxLength: 100
                  pattern: ^[0-9]{8}@gm\.uit\.edu\.vn$
                  example: 22520001@gm.uit.edu.vn
                so_dien_thoai:
                  type: string
                  pattern: ^0[0-9]{9}$
                  maxLength: 20
                  nullable: true
                  example: 0901234567
                lop_sinh_hoat:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: HTTT2022
                ma_khoa:
                  type: integer
                  minimum: 1
                  example: 1
                  description: Lấy từ `GET /organizations?loai_don_vi=Khoa`
                mat_khau:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  example: MatKhau@123
                xac_nhan_mat_khau:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  example: MatKhau@123
                dong_y_nghi_dinh_13:
                  type: boolean
                  enum:
                  - true
                  example: true
      responses:
        '200':
          description: Đã gửi mã OTP 6 chữ số đến email trường của bạn
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: Đã gửi mã OTP 6 chữ số đến email trường của bạn
                  data:
                    type: object
                    required:
                    - email
                    - het_han_sau_giay
                    properties:
                      email:
                        type: string
                        format: email
                        example: 22520001@gm.uit.edu.vn
                      het_han_sau_giay:
                        type: integer
                        example: 600
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      security: []
  /auth/resend-registration-otp:
    post:
      tags:
      - Auth & Account
      summary: Yêu cầu gửi lại mã OTP kích hoạt đăng ký (Tối đa 3 lần / 10 phút - UC-AUTH-01)
      description: '**Quyền:** `Public`.


        Kiểm tra ràng buộc `chk_tamthoi_gui` (`so_lan_gui_otp <= 3` trong cửa sổ 10 phút).'
      operationId: resendRegistrationOtp
      x-roles:
      - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: 22520001@gm.uit.edu.vn
      responses:
        '200':
          description: Đã gửi lại mã OTP kích hoạt
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: Đã gửi lại mã OTP kích hoạt
                  data:
                    type: object
                    required:
                    - so_lan_gui_con_lai
                    - het_han_sau_giay
                    properties:
                      so_lan_gui_con_lai:
                        type: integer
                        example: 2
                      het_han_sau_giay:
                        type: integer
                        example: 600
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      security: []
  /auth/verify-registration-otp:
    post:
      tags:
      - Auth & Account
      summary: Xác thực OTP hoàn tất đăng ký tài khoản Sinh viên (UC-AUTH-01)
      description: '**Quyền:** `Public`.


        Trả về lỗi `OTP_INVALID`, `OTP_EXPIRED` hoặc `OTP_ATTEMPTS_EXCEEDED` (khi nhập sai quá 5 lần).'
      operationId: verifyRegistrationOtp
      x-roles:
      - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - otp
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: 22520001@gm.uit.edu.vn
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                  example: '123456'
      responses:
        '201':
          description: Tài khoản kích hoạt thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: Tài khoản kích hoạt thành công
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: OTP không hợp lệ, hết hạn hoặc nhập sai quá 5 lần (HTTP 400)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                otpInvalid:
                  summary: Sai mã OTP (còn lượt thử)
                  value:
                    success: false
                    error: OTP_INVALID
                    message: Mã OTP không chính xác. Bạn còn 3 lần thử.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                otpExpired:
                  summary: OTP quá hạn hiệu lực
                  value:
                    success: false
                    error: OTP_EXPIRED
                    message: Mã OTP đã hết hạn. Vui lòng yêu cầu gửi lại mã.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                otpAttemptsExceeded:
                  summary: Nhập sai quá 5 lần
                  value:
                    success: false
                    error: OTP_ATTEMPTS_EXCEEDED
                    message: Bạn đã nhập sai quá số lần cho phép. Vui lòng yêu cầu mã OTP mới.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      security: []
  /auth/login:
    post:
      tags:
      - Auth & Account
      summary: Đăng nhập hệ thống qua Sanctum SPA Cookie & Thực thi Single Active Session cho Sinh viên (UC-AUTH-02)
      description: '**Quyền:** `Public`.


        - Cho phép đăng nhập bằng **Email trường** hoặc **MSSV** (`ten_dang_nhap`).

        - Nếu `loai_tai_khoan = SinhVien`: xóa toàn bộ phiên cũ trong bảng `sessions` (Single Active Session).

        - Thiết lập HTTP-Only Cookie `laravel_session`. Nếu `user.buoc_doi_mat_khau = true`, FE điều hướng sang màn hình Đổi
        mật khẩu lần đầu.

        - **Phân biệt hai kiểu khóa:** `403 ACCOUNT_LOCKED` khi `hoat_dong = 0` (Admin khóa tài khoản). `429 RATE_LIMIT_EXCEEDED`
        (kèm `Retry-After`) khi nhập sai quá 5 lần trong 1 phút — hệ thống tạm khóa đăng nhập 5 phút (`UC-AUTH-02.EX.3`).'
      operationId: login
      x-roles:
      - Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ten_dang_nhap
              - mat_khau
              properties:
                ten_dang_nhap:
                  type: string
                  minLength: 5
                  maxLength: 100
                  example: '22520001'
                  description: MSSV (8 chữ số) hoặc địa chỉ Email (`@gm.uit.edu.vn` / `@uit.edu.vn`)
                mat_khau:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  example: MatKhau@123
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - server_time
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  message:
                    type: string
                    example: Đăng nhập thành công
                  data:
                    $ref: '#/components/schemas/User'
                  server_time:
                    type: string
                    format: date-time
                    example: '2026-10-25T08:30:00+07:00'
                    description: Thời gian chuẩn của máy chủ (NTP) dùng để đồng bộ đồng hồ đếm ngược trên FE
        '401':
          description: Email/MSSV hoặc mật khẩu không chính xác (HTTP 401 - `UC-AUTH-02.EX.1`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidCredentials:
                  summary: Nhập sai Email/MSSV hoặc mật khẩu
                  value:
                    success: false
                    error: INVALID_CREDENTIALS
                    message: Thông tin đăng nhập không hợp lệ.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '403':
          description: Tài khoản đang bị khóa (HTTP 403)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                accountLocked:
                  summary: '`hoat_dong = 0`'
                  value:
                    success: false
                    error: ACCOUNT_LOCKED
                    message: Tài khoản của bạn hiện đang bị tạm khóa. Vui lòng liên hệ Quản trị viên hệ thống.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
      security: []
  /auth/logout:
    post:
      tags:
      - Auth & Account
      summary: Đăng xuất an toàn & Thu hồi phiên làm việc trong bảng `sessions` (UC-AUTH-05)
      description: '**Quyền:** `SinhVien`, `ToChuc`, `Admin`.'
      operationId: logout
      security:
      - SanctumSession: []
      x-roles:
      - SinhVien
      - ToChuc
      - Admin
      responses:
        '200':
          description: Đăng xuất thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/me:
    get:
      tags:
      - Auth & Account
      summary: Lấy thông tin tài khoản đang đăng nhập & Quyền hạn hiện hành (UC-AUTH-02, UC-AUTH-03)
      description: '**Quyền:** `SinhVien`, `ToChuc`, `Admin`.'
      operationId: getCurrentUser
      security:
      - SanctumSession: []
      x-roles:
      - SinhVien
      - ToChuc
      - Admin
      responses:
        '200':
          description: Lấy thông tin hồ sơ thành công
          headers:
            X-Request-Id:
