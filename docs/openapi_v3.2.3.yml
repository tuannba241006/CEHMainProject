          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
components:
  securitySchemes:
    SanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: 'Xác thực phiên làm việc chuẩn Laravel Sanctum SPA (`NFR-SEC-01`). Trình duyệt gọi `GET /sanctum/csrf-cookie`
        trước khi đăng nhập, bật `withCredentials: true` và đính kèm header `X-XSRF-TOKEN` cho mọi request thay đổi dữ liệu
        (POST/PUT/DELETE). Khi tài khoản có cờ `buoc_doi_mat_khau = true`, chỉ 3 endpoint `/auth/me`, `/auth/change-password`
        và `/auth/logout` được miễn trừ; các endpoint khác trả về `403 PASSWORD_CHANGE_REQUIRED`.'
    KioskTokenAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Token phiên trình chiếu hội trường độc lập được cấp từ bảng `phien_kiosk` (`UC-OPS-01`).
  headers:
    XRequestId:
      description: Mã định danh truy vết request duy nhất (UUID) phục vụ đối soát nhật ký lỗi giữa FE và BE.
      schema:
        type: string
        format: uuid
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    RetryAfter:
      description: Số giây FE cần chờ trước khi gửi lại request khi chạm ngưỡng Rate Limit (HTTP 429).
      schema:
        type: integer
        example: 60
    SetCsrfCookie:
      description: Thiết lập cookie `XSRF-TOKEN` (cho phép JS đọc để đính vào header `X-XSRF-TOKEN`) và `laravel_session`
        (`HttpOnly`).
      schema:
        type: string
        example: XSRF-TOKEN=eyJpdiI6...; Path=/; SameSite=Lax
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Mã định danh bản ghi (BIGINT UNSIGNED)
      schema:
        type: integer
        minimum: 1
        example: 101
    Page:
      name: page
      in: query
      description: Số thứ tự trang (bắt đầu từ 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Số bản ghi tối đa trên một trang (1 - 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: Mã định danh thiết bị độc lập lưu tại trình duyệt phục vụ kiểm soát chống quét hộ (`Device Binding` - `UC-OPS-03`).
      schema:
        type: string
        minLength: 8
        maxLength: 100
        example: dev_fp_9b1deb4d3b7d4bad9bdd
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Khóa chống gửi trùng giao dịch khi mạng di động chập chờn (UUID v4, tùy chọn). BE lưu khóa trong bảng `cache`
        và khóa tương tranh qua bảng `cache_locks` (2 bảng hạ tầng có sẵn trong Database v3.1.2) với **TTL = 5 phút** gắn
        theo `(ma_tai_khoan, method, path, Idempotency-Key)`. Nếu gửi trùng key cùng payload trong 5 phút sẽ trả lại kết quả
        trước đó; nếu đang xử lý dở hoặc khác tham số/payload sẽ trả về `409 IDEMPOTENCY_CONFLICT`.
      schema:
        type: string
        format: uuid
        example: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
  responses:
    ValidationError:
      description: Dữ liệu gửi lên không vượt qua kiểm tra hợp lệ Form Request (HTTP 422)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validationFailed:
              value:
                success: false
                error: VALIDATION_FAILED
                message: MSSV không trùng khớp với định danh địa chỉ email trường của bạn
                errors:
                  mssv:
                  - Tiền tố email phải khớp chính xác với MSSV 8 chữ số.
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    UnauthorizedError:
      description: Chưa đăng nhập hoặc phiên làm việc đã bị thu hồi do đăng nhập thiết bị mới (HTTP 401)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unauthenticated:
              value:
                success: false
                error: UNAUTHENTICATED
                message: Vui lòng đăng nhập để tiếp tục
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
            sessionRevoked:
              value:
                success: false
                error: SESSION_REVOKED
                message: Tài khoản của bạn vừa đăng nhập trên một thiết bị khác (Single Active Session).
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    ForbiddenError:
      description: Không đủ quyền truy cập theo RBAC, tài khoản bị khóa hoặc bắt buộc đổi mật khẩu lần đầu (HTTP 403)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            forbidden:
              value:
                success: false
                error: FORBIDDEN
                message: Bạn không có quyền thực hiện thao tác này
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
            passwordChangeRequired:
              value:
                success: false
                error: PASSWORD_CHANGE_REQUIRED
                message: Vui lòng đổi mật khẩu khởi tạo lần đầu trước khi sử dụng hệ thống.
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    NotFoundError:
      description: Không tìm thấy tài nguyên yêu cầu hoặc sự kiện chưa được công bố công khai (HTTP 404)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notFound:
              value:
                success: false
                error: NOT_FOUND
                message: Tài nguyên yêu cầu không tồn tại
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    RateLimitError:
      description: Vượt quá giới hạn tần suất gửi yêu cầu (HTTP 429)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rateLimit:
              value:
                success: false
                error: RATE_LIMIT_EXCEEDED
                message: Bạn đã thao tác quá nhanh. Vui lòng thử lại sau 60 giây.
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    ServiceUnavailableError:
      description: Dịch vụ AI ngoại vi tạm thời gián đoạn - Circuit Breaker kích hoạt (HTTP 503)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            aiUnavailable:
              value:
                success: false
                error: AI_UNAVAILABLE
                message: Trợ lý AI hiện đang bận. Vui lòng thử lại sau ít phút hoặc nhập nội dung thủ công.
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    GatewayTimeoutError:
      description: Truy vấn phân tích AI vượt quá giới hạn thời gian 3.0 giây (HTTP 504)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            aiTimeout:
              value:
                success: false
                error: AI_TIMEOUT
                message: Truy vấn dữ liệu vượt quá thời gian cho phép (3.0s). Vui lòng thu hẹp câu hỏi.
                trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
  schemas:
    ApiSuccessMessage:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          enum:
          - true
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công
    ApiError:
      type: object
      required:
      - success
      - error
      - message
      properties:
        success:
          type: boolean
          enum:
          - false
          example: false
        error:
          type: string
          enum:
          - UNAUTHENTICATED
          - SESSION_REVOKED
          - FORBIDDEN
          - ACCOUNT_LOCKED
          - PASSWORD_CHANGE_REQUIRED
          - NOT_ELIGIBLE
          - CERT_REVOKED
          - DEVICE_ALREADY_USED
          - STAFF_NOT_ASSIGNED
          - KIOSK_TOKEN_INVALID
          - NOT_FOUND
          - VALIDATION_FAILED
          - TOPIC_DELETED
          - OTP_INVALID
          - OTP_EXPIRED
          - OTP_ATTEMPTS_EXCEEDED
          - TICKET_INVALID_SIGNATURE
          - TICKET_WRONG_EVENT
          - TOTP_INVALID
          - CANNOT_CANCEL_WITHIN_4_HOURS
          - AI_QUERY_REJECTED
          - SLOT_SOLD_OUT
          - REGISTRATION_CLOSED
          - SCHEDULE_CONFLICT_HARD
          - ALREADY_REGISTERED
          - TICKETS_AVAILABLE
          - ALREADY_IN_WAITLIST
          - WAITLIST_CLOSED
          - OFFER_EXPIRED
          - OFFER_SKIPPED_CONFLICT
          - ROOM_CONFLICT
          - ROOM_MAINTENANCE_CONFLICT
          - CAPACITY_EXCEEDS_ROOM
          - START_IN_PAST
          - INVALID_STATE_TRANSITION
          - GATE_CLOSED
          - CHECKOUT_TOO_EARLY
          - TICKET_ALREADY_USED
          - NOT_CHECKED_IN
          - ALREADY_CHECKED_IN
          - DRL_LOCKED
          - DRL_NOT_READY
          - FEEDBACK_WINDOW_CLOSED
          - FEEDBACK_ALREADY_SUBMITTED
          - RATE_LIMIT_EXCEEDED
          - AI_UNAVAILABLE
          - AI_TIMEOUT
          - INVALID_CREDENTIALS
          - CSRF_TOKEN_MISMATCH
          - IDEMPOTENCY_CONFLICT
          - INTERNAL_ERROR
          example: SCHEDULE_CONFLICT_HARD
          description: Mã lỗi chuẩn hóa giúp FE rẽ nhánh giao diện chính xác mà không phụ thuộc chuỗi message.
        message:
          type: string
          example: Thông báo chi tiết về lỗi phát sinh
        errors:
          type: object
          nullable: true
          description: Chi tiết lỗi theo từng trường dữ liệu (khi `error = VALIDATION_FAILED`)
          additionalProperties:
            type: array
            items:
              type: string
        trace_id:
          type: string
          nullable: true
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        chi_tiet:
          type: object
          nullable: true
          description: Dữ liệu ngữ cảnh có cấu trúc kèm theo mã lỗi (tự động ánh xạ theo `ConflictingEventDetail`, `RoomMaintenanceConflictDetail`
            hoặc `TicketAlreadyUsedDetail`)
          oneOf:
          - $ref: '#/components/schemas/ConflictingEventDetail'
          - $ref: '#/components/schemas/RoomMaintenanceConflictDetail'
          - $ref: '#/components/schemas/TicketAlreadyUsedDetail'
    PaginationMeta:
      type: object
      required:
      - trang_hien_tai
      - tong_so_trang
      - tong_so_ban_ghi
      - kich_thuoc_trang
      properties:
        trang_hien_tai:
          type: integer
          minimum: 1
          example: 1
        tong_so_trang:
          type: integer
          minimum: 0
          example: 5
        tong_so_ban_ghi:
          type: integer
          minimum: 0
          example: 98
        kich_thuoc_trang:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
    OrganizationSummary:
      type: object
      required:
      - ma_don_vi_to_chuc
      - ten_don_vi
      - ma_dinh_danh
      - loai_don_vi
      properties:
        ma_don_vi_to_chuc:
          type: integer
          example: 1
        ma_don_vi_cha:
          type: integer
          nullable: true
          example: null
        ten_don_vi:
          type: string
          maxLength: 200
          example: Khoa Hệ thống Thông tin
        ma_dinh_danh:
          type: string
          maxLength: 50
          example: KHOA_HTTT
        loai_don_vi:
          type: string
          enum:
          - CLB
          - DoanHoi
          - Khoa
          - PhongBan
          example: Khoa
        logo_url:
          type: string
          maxLength: 500
          nullable: true
    Organization:
      allOf:
      - $ref: '#/components/schemas/OrganizationSummary'
      - type: object
        required:
        - hoat_dong
        - thoi_gian_tao
        - thoi_gian_cap_nhat
        properties:
          mo_ta:
            type: string
            nullable: true
          hoat_dong:
            type: boolean
            example: true
          thoi_gian_tao:
            type: string
            format: date-time
          thoi_gian_cap_nhat:
            type: string
            format: date-time
    Topic:
      type: object
      required:
      - ma_chuyen_de
      - ten_chuyen_de
      - da_xoa
      properties:
        ma_chuyen_de:
          type: integer
          example: 1
        ten_chuyen_de:
          type: string
          maxLength: 100
          example: Trí tuệ Nhân tạo & Khoa học Dữ liệu
        mo_ta:
          type: string
          maxLength: 255
          nullable: true
        da_xoa:
          type: boolean
          example: false
    User:
      type: object
      required:
      - ma_tai_khoan
      - ho_ten
      - email
      - loai_tai_khoan
      - dong_y_nghi_dinh_13
      - buoc_doi_mat_khau
      - la_nhan_vien_soat_ve
      - hoat_dong
      - thoi_gian_tao
      properties:
        ma_tai_khoan:
          type: integer
          example: 1
        ho_ten:
          type: string
          maxLength: 150
          example: Nguyễn Văn An
        mssv:
          type: string
          pattern: ^[0-9]{8}$
          nullable: true
          example: '22520001'
        email:
          type: string
          format: email
          maxLength: 100
          example: 22520001@gm.uit.edu.vn
        loai_tai_khoan:
          type: string
          enum:
          - SinhVien
          - ToChuc
          - Admin
          example: SinhVien
        so_dien_thoai:
          type: string
          maxLength: 20
          nullable: true
          example: 0901234567
        lop_sinh_hoat:
          type: string
          maxLength: 50
          nullable: true
          example: HTTT2022
        ma_khoa:
          type: integer
          nullable: true
          example: 1
        khoa:
          type: string
          maxLength: 100
          nullable: true
          example: Khoa Hệ thống Thông tin
        ma_don_vi_to_chuc:
          type: integer
          nullable: true
          example: null
        don_vi:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          nullable: true
          description: Chi tiết đơn vị tổ chức của tài khoản `ToChuc`/`Admin` (giúp FE phân biệt Faculty Reviewer `loai_don_vi=Khoa
            & ma_don_vi_cha=null` với CLB cấp Khoa)
        avatar_url:
          type: string
          maxLength: 500
          nullable: true
        dong_y_nghi_dinh_13:
          type: boolean
          example: true
        buoc_doi_mat_khau:
          type: boolean
          example: false
          description: True nếu là tài khoản nội bộ mới cấp phát chưa đổi mật khẩu lần đầu (`UC-AUTH-02`)
        la_nhan_vien_soat_ve:
          type: boolean
          example: false
          description: True nếu sinh viên được phân công làm Staff cho ít nhất 1 sự kiện diễn ra trong ngày hôm nay (hiển
            thị lối tắt `/scanner`)
        hoat_dong:
          type: boolean
          example: true
        thoi_gian_tao:
          type: string
          format: date-time
    RoomEquipment:
      type: object
      required:
      - may_chieu
      - am_thanh
      - wifi
      properties:
        may_chieu:
          type: boolean
          example: true
        am_thanh:
          type: boolean
          example: true
        micro_khong_day:
          type: integer
          minimum: 0
          example: 4
        wifi:
          type: boolean
          example: true
        dieu_hoa:
          type: boolean
          example: true
        ghi_chu:
          type: string
          maxLength: 255
          nullable: true
          example: Màn hình LED P2.5
    Room:
      type: object
      required:
      - ma_phong
      - ten_phong
      - co_so
      - suc_chua_toi_da
      - trang_thai
      - da_xoa
      properties:
        ma_phong:
          type: integer
          example: 1
        ten_phong:
          type: string
          maxLength: 100
          example: Hội trường E
        co_so:
          type: string
          enum:
          - CoSo1
          - CoSo2
          example: CoSo1
        suc_chua_toi_da:
          type: integer
