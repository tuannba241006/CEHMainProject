    EventWriteRequest:
      type: object
      required:
      - ten_su_kien
      - mo_ta
      - ma_chuyen_de
      - ma_phong
      - ngay_cong_bo
      - thoi_gian_bat_dau
      - thoi_gian_ket_thuc
      - khong_gioi_han_slot
      - dieu_khoan_drl
      - diem_drl_du_kien
      description: "Ràng buộc chéo cấp Schema (`UC-EVT-01` & `chk_sukien_soluong`, `chk_sukien_drl`):\n1. **Cấu hình Slot\
        \ (`khong_gioi_han_slot` & `so_luong_toi_da`):**\n   - Khi `khong_gioi_han_slot = false`: bắt buộc `so_luong_toi_da`\
        \ là số nguyên `>= 1` (và `<= phong.suc_chua_toi_da`).\n   - Khi `khong_gioi_han_slot = true`: bắt buộc `so_luong_toi_da\
        \ = null`.\n2. **Cấu hình ĐRL (`dieu_khoan_drl` & `diem_drl_du_kien`):**\n   - Khi `dieu_khoan_drl = 'KhongCo'`: bắt\
        \ buộc `diem_drl_du_kien = 0`.\n   - Khi `dieu_khoan_drl` là `'Dieu3'` hoặc `'Dieu4'`: bắt buộc `diem_drl_du_kien`\
        \ từ 1 đến 5 (khuyến nghị 3 đến 5).\n3. **Chuyên đề (`ma_chuyen_de`):** Phải trỏ tới chuyên đề đang hoạt động (`da_xoa = 0`); nếu\
        \ chuyên đề đã xóa mềm trả về `422 TOPIC_DELETED`."
      properties:
        ten_su_kien:
          type: string
          minLength: 5
          maxLength: 255
          example: Hội thảo Ứng dụng Cloud Native trong Doanh nghiệp
        anh_bia:
          type: string
          maxLength: 500
          nullable: true
          description: Đường dẫn ảnh nội bộ do `POST /uploads/images` cấp (chặn URL ngoài / `javascript:`)
          pattern: ^(/storage/uploads/|https://campuseventhub\.uit\.edu\.vn/storage/uploads/)[a-zA-Z0-9/_-]+\.(jpg|jpeg|png|webp)$
        dien_gia:
          type: string
          maxLength: 200
          nullable: true
          example: TS. Nguyễn Văn C - Cloud Architect
        mo_ta:
          type: string
          minLength: 10
        lo_trinh:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AgendaItem'
        doi_tuong_tham_gia:
          type: string
          maxLength: 255
          nullable: true
          example: Sinh viên toàn trường UIT
        ma_chuyen_de:
          type: integer
          minimum: 1
          example: 1
        ma_phong:
          type: integer
          minimum: 1
          example: 1
        ngay_cong_bo:
          type: string
          format: date-time
          description: Bắt buộc `ngay_cong_bo <= thoi_gian_bat_dau`
        thoi_gian_bat_dau:
          type: string
          format: date-time
        thoi_gian_ket_thuc:
          type: string
          format: date-time
        khong_gioi_han_slot:
          type: boolean
          default: false
        so_luong_toi_da:
          type: integer
          minimum: 1
          nullable: true
          example: 100
        dieu_khoan_drl:
          type: string
          enum:
          - KhongCo
          - Dieu3
          - Dieu4
          default: KhongCo
        diem_drl_du_kien:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
          example: 5
        gio_tinh_nguyen:
          type: number
          format: float
          minimum: 0.0
          maximum: 999.9
          default: 0.0
        danh_sach_co_host_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: Danh sách `ma_don_vi_to_chuc` của các đơn vị đồng tổ chức (không được trùng Host A)
        ma_don_vi_to_chuc:
          type: integer
          minimum: 1
          nullable: true
          example: 2
          description: 'Mã đơn vị chủ trì sự kiện (Host A). Nếu người gọi là `ToChuc`: BE tự động lấy `user.ma_don_vi_to_chuc`
            từ phiên đăng nhập. Nếu người gọi là `Admin`: bắt buộc truyền `ma_don_vi_to_chuc` (trừ khi tài khoản Admin đã
            gắn sẵn đơn vị trong hồ sơ).'
      allOf:
      - oneOf:
        - title: LimitedSlotPolicy
          required:
          - khong_gioi_han_slot
          - so_luong_toi_da
          properties:
            khong_gioi_han_slot:
              type: boolean
              enum:
              - false
            so_luong_toi_da:
              type: integer
              minimum: 1
              nullable: false
              example: 100
        - title: UnlimitedSlotPolicy
          required:
          - khong_gioi_han_slot
          properties:
            khong_gioi_han_slot:
              type: boolean
              enum:
              - true
            so_luong_toi_da:
              type: integer
              nullable: true
              enum:
              - null
              example: null
      - oneOf:
        - title: NoDrlPolicy
          required:
          - dieu_khoan_drl
          - diem_drl_du_kien
          properties:
            dieu_khoan_drl:
              type: string
              enum:
              - KhongCo
            diem_drl_du_kien:
              type: integer
              enum:
              - 0
              example: 0
        - title: HasDrlPolicy
          required:
          - dieu_khoan_drl
          - diem_drl_du_kien
          properties:
            dieu_khoan_drl:
              type: string
              enum:
              - Dieu3
              - Dieu4
            diem_drl_du_kien:
              type: integer
              minimum: 1
              maximum: 5
              example: 5
