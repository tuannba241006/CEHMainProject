      allOf:
      - $ref: '#/components/schemas/Ticket'
      - type: object
        required:
        - chu_ky_hmac
        - payload_qr
        - yeu_cau_wake_lock
        properties:
          chu_ky_hmac:
            type: string
            minLength: 64
            maxLength: 64
            example: a8f5f167f44f4964e6c998dee827110c849f8a12c3e4b5a6c7d8e9f012345678
          payload_qr:
            type: string
            pattern: ^CEH1\.[0-9a-fA-F-]{36}\.[0-9]+\.[0-9]+\.[0-9a-f]{64}$
            example: CEH1.9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d.1.101.a8f5f167f44f4964e6c998dee827110c849f8a12c3e4b5a6c7d8e9f012345678
            description: 'Chuỗi đóng gói vào mã QR cá nhân: `CEH1.{ma_ve_uuid}.{ma_tai_khoan}.{ma_su_kien}.{chu_ky_hmac}`.

              **Quy tắc ký HMAC-SHA256 (`UC-BOOK-01` Bước 4.f & `UC-OPS-02` Bước 4):** Chuỗi gốc đem ký ghép bằng dấu phân
              cách `|` `PayloadToSign = "{ma_ve_uuid}|{ma_tai_khoan}|{ma_su_kien}"`, và `chu_ky_hmac = HMAC_SHA256(PayloadToSign,
              APP_SECRET_KEY)`.'
          yeu_cau_wake_lock:
            type: boolean
            example: true
            description: Chỉ dẫn FE kích hoạt `navigator.wakeLock.request('screen')`
