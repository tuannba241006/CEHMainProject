                  summary: Chưa được phân công hoặc ngoài ngày hiệu lực
                  value:
                    success: false
                    error: STAFF_NOT_ASSIGNED
                    message: Bạn không có quyền soát vé cho sự kiện này hoặc sự kiện không diễn ra trong ngày hôm nay.
                    trace_id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Vé đã quét trước đó, chưa Check-in mà quét Check-out, hoặc cổng điểm danh đang đóng (`TICKET_ALREADY_USED`,
            `NOT_CHECKED_IN`, `GATE_CLOSED`)
