        trang_thai:
          type: string
          enum:
          - KhaDung
          - BaoTri
          example: KhaDung
        bao_tri_tu_ngay:
          type: string
          format: date-time
          nullable: true
        bao_tri_den_ngay:
          type: string
          format: date-time
          nullable: true
        da_xoa:
          type: boolean
          example: false
        thoi_gian_tao:
          type: string
          format: date-time
        thoi_gian_cap_nhat:
          type: string
          format: date-time
    RoomScheduleBlock:
      type: object
      required:
      - loai_khoang
      - thoi_gian_bat_dau
      - thoi_gian_ket_thuc
      - tieu_de
