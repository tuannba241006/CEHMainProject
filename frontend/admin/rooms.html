<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hội trường — Campus Event Hub</title>
    <link rel="stylesheet" href="/css/rooms.css">
</head>
<body>
    <div class="container">
        <header class="header-bar">
            <div>
                <h1>Campus Event Hub</h1>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Phân hệ Quản trị — Quản lý Hội trường & Lịch phòng</p>
            </div>
            <nav class="nav-links">
                <a href="/admin/rooms.html" class="active">Hội trường</a>
                <a href="/admin/room-schedule.html">Lịch & Khả dụng</a>
                <a href="/admin/room-form.html" class="btn btn-primary">+ Tạo phòng mới</a>
            </nav>
        </header>

        <section class="card">
            <form id="filterForm" class="filter-bar">
                <div class="form-group">
                    <label for="filterCoSo">Cơ sở</label>
                    <select id="filterCoSo" class="form-control">
                        <option value="">-- Tất cả cơ sở --</option>
                        <option value="CoSo1">Cơ sở 1</option>
                        <option value="CoSo2">Cơ sở 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterSucChua">Sức chứa tối thiểu</label>
                    <input type="number" id="filterSucChua" class="form-control" placeholder="VD: 50" min="10">
                </div>
                <div class="form-group">
                    <label for="filterTrangThai">Trạng thái</label>
                    <select id="filterTrangThai" class="form-control">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option value="KhaDung">Khả Dụng</option>
                        <option value="BaoTri">Bảo Trì</option>
                    </select>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="submit" class="btn btn-primary">Lọc</button>
                    <button type="button" id="btnResetFilter" class="btn btn-secondary">Đặt lại</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div id="loadingStatus" style="text-align: center; color: var(--text-muted); padding: 16px;">Đang tải danh sách phòng...</div>
            <div class="table-responsive">
                <table id="roomsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Tên phòng</th>
                            <th>Cơ sở</th>
                            <th>Sức chứa</th>
                            <th>Trạng bị</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="roomsTableBody">
                    </tbody>
                </table>
            </div>
            <div id="paginationBar" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                <span id="pageInfo" style="font-size: 0.875rem; color: var(--text-muted);"></span>
                <div style="display: flex; gap: 8px;">
                    <button id="btnPrevPage" class="btn btn-secondary btn-sm" disabled>Trang trước</button>
                    <button id="btnNextPage" class="btn btn-secondary btn-sm" disabled>Trang sau</button>
                </div>
            </div>
        </section>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="/js/rooms.js"></script>
</body>
</html>
