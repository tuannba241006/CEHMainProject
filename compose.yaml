services:
  app:
    build:
      context: ./docker/php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command:
      - sh
      - -lc
      - |
        if [ ! -f ".env" ]; then
          cp .env.example .env
        fi
        if [ ! -f "vendor/autoload.php" ]; then
          composer install --no-interaction --prefer-dist
        fi
        if ! grep -q "^APP_KEY=base64:" .env 2>/dev/null; then
          php artisan key:generate --force
        fi
        mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
        chmod -R 775 storage bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
        php artisan migrate --force
        php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ceh
      DB_USERNAME: ceh_user
      DB_PASSWORD: ceh_local_password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: "no-reply@ceh.local"
      MAIL_FROM_NAME: "Campus Event Hub"
      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: ""
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  mock-server:
    image: stoplight/prism:5
    restart: unless-stopped
    ports:
      - "4010:4010"
    volumes:
      - ./docs/openapi_v3.2.3.yml:/docs/openapi.yml:ro
      - ./docker/mock/proxy.js:/docker/mock/proxy.js:ro
    entrypoint: /bin/sh
    command:
      - -c
      - "node /docker/mock/proxy.js & exec node /usr/src/prism/packages/cli/dist/index.js mock -h 127.0.0.1 -p 4011 -m=false /docs/openapi.yml"

  frontend:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ceh
      MYSQL_USER: ceh_user
      MYSQL_PASSWORD: ceh_local_password
      MYSQL_ROOT_PASSWORD: ceh_root_local_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  backend_vendor:
